# Despliegue de Orienta en Render (Blueprint).
services:
  - type: web
    name: orienta
    runtime: python
    plan: free
    buildCommand: pip install -r web/requirements.txt
    startCommand: gunicorn --chdir web --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
